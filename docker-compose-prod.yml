services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoloapp
      POSTGRES_USER: yolo
      POSTGRES_PASSWORD: yolo_pass
    volumes:
      - db-data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolo -d yoloapp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    entrypoint: ["/app/entrypoint.sh"]
    command: ["gunicorn", "server.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "${GUNICORN_WORKERS:-4}", "--timeout", "${GUNICORN_TIMEOUT:-300}"]
    environment:
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-1}"
      COLLECTSTATIC: "${COLLECTSTATIC:-1}"
      DEBUG: "${DJANGO_DEBUG:-0}"
      SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me}"
      ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-wheatai.net,www.wheatai.net}"
      CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-https://wheatai.net,https://www.wheatai.net}"
      CORS_ALLOWED_ORIGINS: "${DJANGO_CORS_ALLOWED_ORIGINS:-https://wheatai.net,https://www.wheatai.net}"
      CORS_ALLOW_ALL: "${DJANGO_CORS_ALLOW_ALL:-0}"
      SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-1}"
      SESSION_COOKIE_SECURE: "${DJANGO_SESSION_COOKIE_SECURE:-1}"
      CSRF_COOKIE_SECURE: "${DJANGO_CSRF_COOKIE_SECURE:-1}"
      SECURE_HSTS_SECONDS: "${DJANGO_SECURE_HSTS_SECONDS:-31536000}"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-1}"
      SECURE_HSTS_PRELOAD: "${DJANGO_SECURE_HSTS_PRELOAD:-1}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: yolo
      DB_PASSWORD: yolo_pass
      DB_NAME: yoloapp
      # Detection Model
      MODEL_SPIKE:    "/app/models/spike.pt"
      MODEL_SPIKELET: "/app/models/spikelet.pt"
      MODEL_FHB:      "/app/models/fhb.pt"
      MODEL_FDK:      "/app/models/fdk.pt"
      MODEL_KERNEL:   "/app/models/kernel.pt"
      DETECTION_TASK: "obb"
      # Celery/Redis
      CELERY_BROKER_URL: "redis://redis:6379/0"
      # Use Redis for result backend as well to support chords/callbacks
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      MEDIA_ROOT: "/app/media"
      DOWNLOAD_LABELS: "${DOWNLOAD_LABELS:-1}"
    volumes:
      - ./models:/app/models
      - ./media:/app/media
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # healthcheck disabled to reduce startup time
    # healthcheck:
    #   test: ["CMD-SHELL", "python manage.py showmigrations --plan >/dev/null 2>&1 || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  worker:
    build: ./backend
    entrypoint: ["/app/entrypoint.sh"]
    command: ["celery", "-A", "server", "worker", "-l", "info"]
    environment:
      RUN_MIGRATIONS: "0"               # <- no migrations here
      DEBUG: "${DJANGO_DEBUG:-0}"
      SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me}"
      DB_NAME: yoloapp
      DB_USER: yolo
      DB_PASSWORD: yolo_pass
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Allow Celery to run as root inside the container (suppresses warning)
      C_FORCE_ROOT: "true"
      MODEL_KERNEL: "/app/models/kernel.pt"
      DETECTION_TASK: "obb"
      MEDIA_ROOT: "/app/media"
      DOWNLOAD_LABELS: "${DOWNLOAD_LABELS:-1}"
    volumes:
      - ./models:/app/models
      - ./media:/app/media
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend-build:
    build: ./frontend
    working_dir: /app
    environment:
      VITE_DOWNLOAD_LABELS: "${DOWNLOAD_LABELS:-1}"
    command: ["sh","-lc","npm install && npm run build"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: "no"

  nginx:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /etc/nginx/docker-entrypoint.sh > /tmp/docker-entrypoint.sh && chmod +x /tmp/docker-entrypoint.sh && exec /tmp/docker-entrypoint.sh \"$@\"", "--"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./nginx/selfsigned:/etc/selfsigned:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/docker-entrypoint.sh:/etc/nginx/docker-entrypoint.sh:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    command: >-
      certonly --webroot -w /var/www/certbot
      -d wheatai.net -d www.wheatai.net
      --email ghimirehillson@gmail.com --agree-tos --no-eff-email
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: "no"

  certbot-renew:
    image: certbot/certbot:latest
    depends_on:
      nginx:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        while true; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 12h
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped

volumes:
  db-data: {}
  letsencrypt: {}
  certbot-webroot: {}
